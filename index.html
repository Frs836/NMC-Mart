<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NM MART POS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>NM MART POS</title>
    <link id="app-favicon" rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        try {
          var logo = localStorage.getItem('minimarket_store_logo_v1');
          if (logo && logo.trim()) {
            var link = document.getElementById('app-favicon');
            if (link) {
              link.href = logo;
              link.type = 'image/png';
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
